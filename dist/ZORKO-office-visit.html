<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Inside ZORKO | Office visit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111612;color:#fafaf5;font:16px/1.5 "DM Sans",system-ui,sans-serif}main{width:min(1300px,100%);margin:auto;padding:clamp(16px,4vw,48px)}header,nav,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{border-bottom:1px solid #485049;padding-bottom:16px}.brand{letter-spacing:.12em;font-weight:850}.sub{color:#bac5ba;font-size:.9rem}.stage{position:relative;margin-top:20px;background:#070a08;border-radius:8px;overflow:hidden}video{display:block;width:100%;height:min(65svh,800px);object-fit:contain}.welcome{padding:clamp(30px,8vw,110px) clamp(20px,5vw,70px);background:linear-gradient(110deg,#26382e,#132018)}h1{font:400 clamp(2.7rem,6.5vw,6rem)/1.06 Georgia,serif;letter-spacing:-.05em;margin:0 0 .3em}p{max-width:38rem}button,.pick,a{font:inherit;cursor:pointer;color:inherit}button,.pick{border:1px solid #5d695f;border-radius:5px;background:#223127;padding:8px 16px}.pick{display:inline-block;background:#faaa70;border-color:#faaa70;color:#182019;font-weight:650}.pick:focus-within,button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}.pick input{position:absolute;width:1px;height:1px;opacity:0}.actions{justify-content:start;margin-top:22px}.actions a{font-size:.94rem}nav{margin:18px 0}.strip{display:flex;gap:10px;overflow:auto;padding:4px 2px 10px}.stop{padding:0;overflow:hidden;flex:none;min-width:88px}.stop img{width:128px;height:72px;object-fit:contain;background:#0c100d;display:block}.stop span{padding:4px 10px;display:block;font-variant-numeric:tabular-nums}.stop[aria-current=true]{border:2px solid #faaa70}.controls{display:flex;gap:8px}[hidden]{display:none!important}button:disabled{opacity:.42}.stage:fullscreen video{height:100vh}.note{color:#bac5ba;font-size:.88rem}
</style></head><body><main><header><b class="brand">ZORKO LIMITED</b><span class="sub">Head office visit</span></header>
<section class="stage" id="stage"><div class="welcome" id="welcome"><h1>Inside ZORKO.</h1><p>Select the original office film to enter the visit. Choose any thumbnail to jump to that moment with the team.</p></div><video id="film" controls playsinline hidden aria-label="ZORKO head office film"></video></section>
<div class="actions"><label class="pick"><span id="pickLabel">Open office MP4</span><input type="file" id="source" accept="video/mp4,video/*"></label><a href="https://www.youtube.com/watch?v=CraQLVdyRYs" target="_blank" rel="noopener">Original film on YouTube</a></div>
<p class="note" id="message" role="status">The MP4 plays directly from this device.</p>
<section id="tour" hidden><nav aria-label="Tour navigation"><strong>Explore the footage</strong><div class="controls"><button id="back">Previous moment</button><button id="forward">Next moment</button></div></nav><div class="strip" id="strip" aria-label="Time-indexed footage"></div></section>
</main><script>
const el=id=>document.getElementById(id);
const film=el('film'), strip=el('strip');
let releaseScan=()=>{}, mediaURL='', times=[], buttons=[];
function clock(seconds){return Math.floor(seconds/60)+':'+String(Math.floor(seconds%60)).padStart(2,'0')}
function current(){return Math.max(0,times.findLastIndex(t=>t<=film.currentTime+.04))}
function indicate(){const index=current();buttons.forEach((button,i)=>button.setAttribute('aria-current',String(i===index)));el('back').disabled=index===0;el('forward').disabled=index>=buttons.length-1}
function jump(index){if(index<0||index>=times.length)return;film.currentTime=times[index];indicate();buttons[index].scrollIntoView({block:'nearest',inline:'nearest'})}
el('back').onclick=()=>jump(current()-1);el('forward').onclick=()=>jump(current()+1);film.ontimeupdate=indicate;
function buildFilmstrip(){
 const duration=film.duration;if(!Number.isFinite(duration)||duration<=0)return;
 releaseScan();
 const count=Math.max(1,Math.min(24,Math.ceil(duration/6)));
 times=Array.from({length:count},(_,i)=>duration*i/count);
 strip.replaceChildren();buttons=times.map((time,index)=>{const button=document.createElement('button');button.className='stop';button.setAttribute('aria-label','Go to '+clock(time));const label=document.createElement('span');label.textContent=clock(time);button.append(label);button.onclick=()=>jump(index);strip.append(button);return button});
 el('tour').hidden=false;indicate();
 const scan=document.createElement('video');scan.muted=true;scan.playsInline=true;scan.preload='auto';let index=0,done=false,timer;
 function stop(){if(done)return;done=true;clearTimeout(timer);scan.onloadeddata=scan.onseeked=scan.onerror=null;scan.removeAttribute('src');scan.load()}
 releaseScan=stop;
 const canvas=document.createElement('canvas');canvas.width=200;canvas.height=112;const ctx=canvas.getContext('2d');
 function next(){if(index>=count){stop();return}clearTimeout(timer);timer=setTimeout(stop,9000);scan.currentTime=times[index]}
 function capture(){if(done)return;try{const scale=Math.min(200/scan.videoWidth,112/scan.videoHeight),w=scale*scan.videoWidth,h=scale*scan.videoHeight;ctx.fillStyle='#0c100d';ctx.fillRect(0,0,200,112);ctx.drawImage(scan,(200-w)/2,(112-h)/2,w,h);const img=new Image();img.alt='';img.src=canvas.toDataURL('image/jpeg',.76);buttons[index].prepend(img)}catch{stop();return}index++;next()}
 scan.onloadeddata=()=>{scan.onloadeddata=null;capture()};scan.onseeked=capture;scan.onerror=stop;scan.src=mediaURL;
}
film.onloadedmetadata=()=>{el('message').textContent='Use the film controls to walk through the recording or choose a moment below.';buildFilmstrip()};
film.onerror=()=>{releaseScan();el('tour').hidden=true;el('message').textContent='This browser could not play the file. Open the original film on YouTube or select a compatible MP4.'};
el('source').onchange=e=>{const file=e.target.files[0];if(!file)return;releaseScan();film.pause();const old=mediaURL;mediaURL=URL.createObjectURL(file);times=[];buttons=[];strip.replaceChildren();el('tour').hidden=true;el('welcome').hidden=true;film.hidden=false;el('pickLabel').textContent='Change office film';el('message').textContent='Opening '+file.name;film.src=mediaURL;if(old)URL.revokeObjectURL(old);film.play().catch(()=>{})};
</script></body></html>
