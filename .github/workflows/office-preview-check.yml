name: Office tour preview check
on:
  pull_request:
    paths:
      - 'dist/*office*.html'
      - '.github/workflows/office-preview-check.yml'
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'codex/immersive-office-tour'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the preview in Chromium
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/office-qa"
          python3 -m http.server 8011 --bind 127.0.0.1 --directory dist >"$RUNNER_TEMP/server.log" 2>&1 &
          cd "$RUNNER_TEMP/office-qa"
          npm install --no-save --ignore-scripts puppeteer-core@23.11.1 --silent
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser = await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--disable-dev-shm-usage']});
          try {
            const page = await browser.newPage();
            for (const [name,width,height] of [['desktop',1440,900],['mobile',390,844]]) {
              await page.setViewport({width,height});
              await page.goto('http://127.0.0.1:8011/ZORKO-office-visit.html');
              await page.waitForSelector('#source[type=file]');
              if (await page.evaluate(()=>document.documentElement.scrollWidth > innerWidth)) throw Error('Horizontal overflow on '+name);
              await page.screenshot({path:name+'.png'});
            }
          } finally { await browser.close(); }
          JS
      - name: Locate original film in public ZORKO media
        run: |
          python3 - <<'PY'
          import re,requests,html
          for domain in ['zorko.in','zorkogroup.com']:
              try:
                  data=requests.get('https://'+domain+'/wp-json/wp/v2/media',params={'media_type':'video','per_page':100,'_fields':'source_url,title'},timeout=15)
                  print(domain, 'media catalog:',data.status_code)
                  if data.ok:
                      for entry in data.json(): print('VIDEO:',entry.get('source_url',''))
              except Exception as exc: print('Catalog unavailable:',type(exc).__name__)
          try:
              page=requests.get('https://zorko.in/our-team/',timeout=15)
              urls=re.findall(r'''https?://[^\s"'<>]+''',html.unescape(page.text))
              print('Team page',page.status_code)
              for url in sorted(set(urls)):
                  if '.mp4' in url.lower() or 'CraQLVdyRYs' in url: print('TEAM MEDIA:',url[:260])
          except Exception as exc: print('Team page unavailable:',type(exc).__name__)
          PY
      - name: Retain review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-review
          path: |
            ${{ runner.temp }}/office-qa/*.png
            ${{ runner.temp }}/office-qa/frames-*.jpg
          retention-days: 2
