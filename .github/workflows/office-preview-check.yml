name: Office tour preview check
on:
  pull_request:
    paths:
      - 'dist/**'
      - '.github/workflows/office-preview-check.yml'
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'codex/immersive-office-tour'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare downloadable preview
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/office-qa" "$RUNNER_TEMP/office-preview"
          cp -R dist/. "$RUNNER_TEMP/office-preview/"
          curl --fail --retry 2 -sSL 'https://zorko.in/wp-content/uploads/2026/04/join-our-team.mp4' -o "$RUNNER_TEMP/office-preview/assets/office-tour/office.mp4"
          python3 - <<'PY'
          from pathlib import Path
          import os
          script=Path(os.environ['RUNNER_TEMP'])/'office-preview/office-visit.js'
          script.write_text(script.read_text().replace('https://zorko.in/wp-content/uploads/2026/04/join-our-team.mp4','assets/office-tour/office.mp4'))
          PY
      - name: Exercise the tour in Chrome
        run: |
          set -eu
          python3 -m http.server 8011 --bind 127.0.0.1 --directory dist >"$RUNNER_TEMP/office-qa/server.log" 2>&1 &
          cd "$RUNNER_TEMP/office-qa"
          npm install --no-save --ignore-scripts puppeteer-core@23.11.1 --silent
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          import assert from 'node:assert/strict';
          const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--disable-dev-shm-usage']});
          try {
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            for(const [name,width,height] of [['desktop',1440,900],['mobile',390,844]]){
              await page.setViewport({width,height});
              await page.goto('http://127.0.0.1:8011/office-tour.html',{waitUntil:'networkidle2'});
              await page.waitForFunction(()=>[...document.querySelectorAll('#route img,#scene')].every(i=>i.naturalWidth>0));
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth),false);
              await page.screenshot({path:name+'-entrance.jpg',type:'jpeg',quality:78});
              await page.click('#play');
              await page.waitForFunction(()=>document.querySelector('video').currentTime>.3);
              await page.click('#route button:last-child');
              await page.waitForFunction(()=>document.querySelector('video').currentTime>=27.4 && document.querySelector('video').readyState>=2);
              await page.screenshot({path:name+'-team.jpg',type:'jpeg',quality:78});
              await page.click('#prev');
              await page.waitForFunction(()=>{const t=document.querySelector('video').currentTime;return t>=19.4&&t<22;});
              await page.click('#exit-walk');await page.click('#original');
              assert.match(await page.$eval('#screen iframe',f=>f.src),/CraQLVdyRYs/);
              await page.click('#close');
              assert.ok(await page.$eval('#film',el=>el.hidden));assert.equal(errors.length,0,errors.join('\n'));
            }
          } finally {await browser.close();}
          JS
      - name: Verify public review link
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os,requests
          base='https://raw.githack.com/'+os.environ['GITHUB_REPOSITORY']+'/'+os.environ['HEAD_SHA']+'/dist/'
          for path in ('office-tour.html','office-visit.js','assets/office-tour/training.jpg'):
              res=requests.get(base+path,timeout=15);print(path,res.status_code,res.headers.get('Content-Type'));res.raise_for_status()
              if path.endswith('.html'): assert 'Enter the office' in res.text
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-tour-screenshots
          path: ${{ runner.temp }}/office-qa/*.jpg
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ZORKO-office-preview
          path: ${{ runner.temp }}/office-preview
          retention-days: 14
