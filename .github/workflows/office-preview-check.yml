name: Office tour preview check
on:
  pull_request:
    paths:
      - 'dist/**'
      - '.github/workflows/office-preview-check.yml'
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'codex/immersive-office-tour'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise the WebGL walkthrough
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/office-qa"
          python3 -m http.server 8011 --bind 127.0.0.1 --directory dist >"$RUNNER_TEMP/office-qa/server.log" 2>&1 &
          cd "$RUNNER_TEMP/office-qa"
          npm install --no-save --ignore-scripts puppeteer-core@23.11.1 --silent
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--disable-dev-shm-usage','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader']});
          try{
            const page=await browser.newPage(),errors=[],media=[];
            page.on('pageerror',e=>errors.push(e.message));page.on('request',req=>{if(req.resourceType()==='media'||req.url().includes('youtube'))media.push(req.url());});
            async function waitStop(n){await page.waitForFunction(i=>document.querySelector('#stage').dataset.stop===String(i),{},n);}
            for(const [name,width,height] of [['desktop',1440,900],['phone',390,844]]){
              await page.setViewport({width,height});await page.goto('http://127.0.0.1:8011/office-tour.html');
              await waitStop(-1);await page.waitForSelector('#stage[data-engine=webgl]');
              await page.screenshot({path:name+'-entrance.jpg',type:'jpeg',quality:80});
              assert.equal(await page.$$eval('video,iframe',els=>els.length),0);
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth),false);
              await page.click('#enter');await waitStop(0);
              await page.waitForFunction(()=>renderer.current.atlas&&renderer.frame(performance.now())>4);
              await page.click('#portal');await waitStop(1);await page.keyboard.press('ArrowRight');await waitStop(2);
              await page.click('#directory-open');await page.click('#directory-list button:nth-child(7)');await waitStop(6);
              await page.waitForFunction(()=>renderer.frame(performance.now())===11);
              const before=await page.$eval('#world',e=>e.getBoundingClientRect().width);assert.ok(before>300);
              await page.click('#more');assert.equal(await page.$eval('#zoom-label',e=>e.textContent),'1.25×');
              const box=await (await page.$('#world')).boundingBox();const x=box.x+box.width*.4,y=box.y+box.height*.32;
              const clip={x:Math.round(x),y:Math.round(y),width:80,height:50};
              const ref=await page.screenshot({clip});await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x-60,y+9,{steps:10});await page.mouse.up();
              await page.waitForFunction(()=>renderer.smooth[0]>.04);const after=await page.screenshot({clip});assert.notDeepEqual(ref,after);
              await page.screenshot({path:name+'-workspace.jpg',type:'jpeg',quality:80});
              await page.click('#directory-open');await page.click('#directory-list button:last-child');await waitStop(8);
              await page.click('#portal');await waitStop(-1);
              for(let n=0;n<9;n++){await page.click('#next');await waitStop(n);assert.equal(await page.$eval('#stage',s=>s.dataset.engine),'webgl');}
              await page.keyboard.press('Escape');await waitStop(-1);
            }
            await page.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'reduce'}]);
            await page.reload();await waitStop(-1);await page.click('#enter');await waitStop(0);
            assert.equal(await page.evaluate(()=>renderer.motion),false);
            assert.equal(await page.evaluate(()=>renderer.frame(performance.now())),0);
            const fallback=await browser.newPage();
            await fallback.evaluateOnNewDocument(()=>{const get=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,...args){return type==='webgl'?null:get.call(this,type,...args);};});
            await fallback.goto('http://127.0.0.1:8011/office-tour.html');await fallback.click('#enter');
            await fallback.waitForSelector('#stage[data-stop="0"][data-engine="photo"]');await fallback.click('#portal');
            await fallback.waitForSelector('#stage[data-stop="1"]');
            assert.deepEqual(errors,[]);assert.deepEqual(media,[]);
          }finally{await browser.close();}
          JS
      - name: Verify the review URL
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os,requests
          base='https://raw.githack.com/'+os.environ['GITHUB_REPOSITORY']+'/'+os.environ['HEAD_SHA']+'/dist/'
          for path in ('office-tour.html','office-renderer.js','assets/office-tour/motion-1.webp'):
              r=requests.get(base+path,timeout=25);r.raise_for_status();print(path,r.status_code,r.headers.get('content-type'))
              if path.endswith('.html'): assert 'id="world"' in r.text
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-tour-screenshots
          path: ${{ runner.temp }}/office-qa/*.jpg
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ZORKO-office-preview
          path: dist/
          retention-days: 14
