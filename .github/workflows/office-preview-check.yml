name: Office tour preview check
on:
  pull_request:
    paths:
      - 'dist/*office*.html'
      - '.github/workflows/office-preview-check.yml'
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'codex/immersive-office-tour'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the preview in Chromium
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/office-qa"
          python3 -m http.server 8011 --bind 127.0.0.1 --directory dist >"$RUNNER_TEMP/server.log" 2>&1 &
          cd "$RUNNER_TEMP/office-qa"
          npm install --no-save --ignore-scripts puppeteer-core@23.11.1 --silent
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser = await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--disable-dev-shm-usage']});
          try {
            const page = await browser.newPage();
            for (const [name,width,height] of [['desktop',1440,900],['mobile',390,844]]) {
              await page.setViewport({width,height});
              await page.goto('http://127.0.0.1:8011/ZORKO-office-visit.html');
              await page.waitForSelector('#source[type=file]');
              if (await page.evaluate(()=>document.documentElement.scrollWidth > innerWidth)) throw Error('Horizontal overflow on '+name);
              await page.screenshot({path:name+'.png'});
            }
          } finally { await browser.close(); }
          JS
      - name: Compare company-hosted footage with film reference stills
        run: |
          cd "$RUNNER_TEMP/office-qa"
          python3 -m pip -q install pillow imageio-ffmpeg --target media-tools
          PYTHONPATH=media-tools python3 - <<'PY'
          import requests, subprocess, imageio_ffmpeg, base64, io
          from PIL import Image,ImageDraw
          from pathlib import Path
          url='https://zorko.in/wp-content/uploads/2026/04/join-our-team.mp4'
          with requests.get(url,stream=True,timeout=30) as res:
              res.raise_for_status()
              with open('candidate.mp4','wb') as f:
                  for chunk in res.iter_content(262144): f.write(chunk)
          ff=imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run([ff,'-hide_banner','-i','candidate.mp4','-vf','fps=1/6,scale=160:120:force_original_aspect_ratio=decrease,pad=160:120:(ow-iw)/2:(oh-ih)/2','-frames:v','60','candidate-%03d.jpg'],check=True,stderr=subprocess.PIPE)
          files=sorted(Path('.').glob('candidate-*.jpg'))
          sheet=Image.new('RGB',(640,144*((len(files)+3)//4)))
          draw=ImageDraw.Draw(sheet)
          for i,path in enumerate(files):
              x=i%4*160;y=i//4*144;sheet.paste(Image.open(path),(x,y));draw.text((x+4,y+121),str(i*6)+'s')
          buf=io.BytesIO();sheet.save(buf,format='JPEG',quality=55); print('CANDIDATE='+base64.b64encode(buf.getvalue()).decode())
          PY
      - name: Retain review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-review
          path: |
            ${{ runner.temp }}/office-qa/*.png
            ${{ runner.temp }}/office-qa/frames-*.jpg
          retention-days: 2
