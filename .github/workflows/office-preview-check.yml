name: Office tour preview check
on:
  pull_request:
    paths:
      - 'dist/*office*.html'
      - '.github/workflows/office-preview-check.yml'
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'codex/immersive-office-tour'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the preview in Chromium
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/office-qa"
          python3 -m http.server 8011 --bind 127.0.0.1 --directory dist >"$RUNNER_TEMP/server.log" 2>&1 &
          cd "$RUNNER_TEMP/office-qa"
          npm install --no-save --ignore-scripts puppeteer-core@23.11.1 --silent
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser = await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--disable-dev-shm-usage']});
          try {
            const page = await browser.newPage();
            for (const [name,width,height] of [['desktop',1440,900],['mobile',390,844]]) {
              await page.setViewport({width,height});
              await page.goto('http://127.0.0.1:8011/ZORKO-office-visit.html');
              await page.waitForSelector('#source[type=file]');
              if (await page.evaluate(()=>document.documentElement.scrollWidth > innerWidth)) throw Error('Horizontal overflow on '+name);
              await page.screenshot({path:name+'.png'});
            }
          } finally { await browser.close(); }
          JS
      - name: Inspect public stills from the office film
        run: |
          cd "$RUNNER_TEMP/office-qa"
          python3 - <<'PY'
          import requests,base64
          for index in (1,2,3):
              response=requests.get(f'https://i.ytimg.com/vi/CraQLVdyRYs/hq{index}.jpg',timeout=20)
              if response.ok and response.headers.get('content-type','').startswith('image/'):
                  with open(f'frames-{index}.jpg','wb') as output: output.write(response.content)
                  print('OFFICESTILL'+str(index)+'='+base64.b64encode(response.content).decode())
              else: print('Still unavailable',index,response.status_code)
          PY
      - name: Retain review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-review
          path: |
            ${{ runner.temp }}/office-qa/*.png
            ${{ runner.temp }}/office-qa/frames-*.jpg
          retention-days: 2
