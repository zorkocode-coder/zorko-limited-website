name: Office tour preview check
on:
  pull_request:
    paths:
      - '.github/workflows/office-preview-check.yml'
permissions:
  contents: read
jobs:
  extract:
    if: github.head_ref == 'codex/immersive-office-tour'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        shot: [1, 12, 16, 20, 28]
    steps:
      - name: Sample real office movement from the public company film
        env:
          SHOT: ${{ matrix.shot }}
        run: |
          python -m pip -q install imageio-ffmpeg pillow
          curl --fail --retry 2 -sSL https://zorko.in/wp-content/uploads/2026/04/join-our-team.mp4 -o "$RUNNER_TEMP/office.mp4"
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import base64,subprocess,os,io
          from PIL import Image
          from pathlib import Path
          import imageio_ffmpeg
          ff=imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run([ff,'-loglevel','error','-ss',os.environ['SHOT'],'-i','office.mp4','-vf','fps=8,scale=768:432','-frames:v','12','f-%02d.png'],check=True)
          atlas=Image.new('RGB',(3072,1296))
          for i,f in enumerate(sorted(Path('.').glob('f-*.png'))):
              atlas.paste(Image.open(f),((i%4)*768,(i//4)*432))
          buf=io.BytesIO();atlas.save(buf,format='WEBP',quality=77,method=5)
          b=base64.b64encode(buf.getvalue()).decode()
          print('ATLASBYTES',len(buf.getvalue()))
          for i in range(0,len(b),5000): print('TEXDATA '+b[i:i+5000])
          PY
